[build-system]
requires = ["hatchling>=1.10.0", "ipykernel"]
build-backend = "hatchling.build"

[project]
name = "clang_repl_kernel"
dynamic = ["version"]
description = "IPython kernel forwarding C++ cells to clang-repl"
readme = "README.md"
license = { text = "no license" }
authors = [ { name = "Paul Manstetten", email = "paul.manstetten@tuwien.ac.at" }, ]

requires-python = ">=3.8"
dependencies = [ "ipykernel", "jupyter_client", "pexpect",]

[project.urls]
Homepage = "https://gitlab.tuwien.ac.at/paul.manstetten/clang_repl_kernel"

[tool.hatch.version]
path = "clang_repl_kernel/__init__.py"

# Used to call hatch_build.py
[tool.hatch.build.hooks.custom]


[tool.hatch.build.targets.sdist]
include = [
    "/clang_repl_kernel",
]

[tool.hatch.build.targets.wheel.shared-data]
"data_kernelspec/share" = "share"
